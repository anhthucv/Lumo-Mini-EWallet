spring.application.name=payment-ledger-service
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://payment-ledger-mysql-anhthuchevu-acdf.l.aivencloud.com:18121/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

transaction.limits.deposit.per-transaction=${DEPOSIT_PER_TRANSACTION_LIMIT:50000000.00}
transaction.limits.deposit.daily=${DEPOSIT_DAILY_LIMIT:100000000.00}
transaction.limits.withdraw.per-transaction=${WITHDRAW_PER_TRANSACTION_LIMIT:20000000.00}
transaction.limits.withdraw.daily=${WITHDRAW_DAILY_LIMIT:50000000.00}
transaction.limits.transfer.per-transaction=${TRANSFER_PER_TRANSACTION_LIMIT:50000000.00}
transaction.limits.transfer.daily=${TRANSFER_DAILY_LIMIT:100000000.00}
