spring.application.name=payment-ledger-service
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://payment-ledger-mysql-anhthuchevu-acdf.l.aivencloud.com:18121/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n

spring.web.error.include-message=always

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

transaction.limits.deposit.per-transaction=${DEPOSIT_PER_TRANSACTION_LIMIT:50000000.00}
transaction.limits.deposit.daily=${DEPOSIT_DAILY_LIMIT:100000000.00}
transaction.limits.withdraw.per-transaction=${WITHDRAW_PER_TRANSACTION_LIMIT:20000000.00}
transaction.limits.withdraw.daily=${WITHDRAW_DAILY_LIMIT:50000000.00}
transaction.limits.transfer.per-transaction=${TRANSFER_PER_TRANSACTION_LIMIT:50000000.00}
transaction.limits.transfer.daily=${TRANSFER_DAILY_LIMIT:100000000.00}

risk.rules.large-amount-threshold=${RISK_LARGE_AMOUNT_THRESHOLD:10000000.00}
risk.rules.rapid-outgoing-window-minutes=${RISK_RAPID_OUTGOING_WINDOW_MINUTES:10}
risk.rules.rapid-outgoing-max-successful=${RISK_RAPID_OUTGOING_MAX_SUCCESSFUL:5}

payment.provider.payos.client-id=${PAYOS_CLIENT_ID:}
payment.provider.payos.api-key=${PAYOS_API_KEY:}
payment.provider.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payment.provider.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment-result}
payment.provider.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment-result}
